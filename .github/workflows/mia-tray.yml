name: mia-tray

# Builds, lints and tests the mia-tray desktop companion (feature F18) WITH its
# GUI on all three desktop platforms. The ordinary workspace build/lint/test
# (`make build` / `make lint` / `make test`) covers only the tray's headless
# core, because the GUI needs system libraries (GTK 3 on Linux) that the
# general CI image does not carry; this workflow is where the `gui` feature is
# compiled — including the Linux GTK loop and the Windows pipe / UAC code
# paths that cannot be built on a macOS development host.
on:
  push:
    branches: [main]
    paths:
      - "crates/mia-tray/**"
      - "crates/mia-status-proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/mia-tray.yml"
  pull_request:
    paths:
      - "crates/mia-tray/**"
      - "crates/mia-status-proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/mia-tray.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  tray:
    name: mia-tray (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install GTK 3 headers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - name: Lint (GUI build, warnings denied)
        run: cargo clippy -p mia-tray --features mia-tray/gui -p mia-status-proto --all-targets -- -D warnings

      - name: Test (GUI build)
        run: cargo test -p mia-tray --features mia-tray/gui -p mia-status-proto

      - name: Build the release binary
        run: cargo build --release -p mia-tray --features mia-tray/gui --bin mia-tray

  deny:
    name: cargo-deny (GUI dependency graph)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --features mia-tray/gui
          command: check licenses bans sources
