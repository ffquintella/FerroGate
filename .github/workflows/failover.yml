name: SRV fail-over (Docker)

# Expensive behaviour tests: they build the CMIS image and boot a 3-node cluster,
# then kill/pause nodes and check MIA's SRV fail-over. They are NOT part of the
# regular CI or `make test` (the tests are #[ignore]d). They run only
#   - when a release tag is pushed (same trigger as release.yml), and
#   - on demand: Actions -> "SRV fail-over (Docker)" -> Run workflow
#     (or locally: `make test-failover`).
on:
  push:
    tags:
      - "releases/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  failover:
    name: kill nodes, expect fail-over
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libtss2-dev

      - name: Run the Docker fail-over tests
        run: make test-failover

      - name: Dump container logs on failure
        if: failure()
        run: |
          for c in $(docker ps -aq --filter name=fgfo-); do
            echo "::group::$(docker inspect -f '{{.Name}}' "$c")"
            docker logs --tail 200 "$c" 2>&1 || true
            echo "::endgroup::"
          done
