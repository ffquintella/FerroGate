<?xml version="1.0" encoding="UTF-8"?>
<!--
  FerroGate MIA application icon (master). A steel shield (the identity the
  agent guards) carrying a machine chip whose keyhole glows in the tray's
  "healthy" accent. Raster sizes, the macOS .icns and the Windows .ico are
  generated from this file by scripts/gen-mia-icons.sh; edit only this file.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22364b"/>
      <stop offset="1" stop-color="#0b1622"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7fa"/>
      <stop offset="0.55" stop-color="#c3cfdb"/>
      <stop offset="1" stop-color="#8a9bad"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2c3d"/>
      <stop offset="1" stop-color="#0e1a27"/>
    </linearGradient>
    <linearGradient id="glow" gradientUnits="userSpaceOnUse" x1="0" y1="432" x2="0" y2="610">
      <stop offset="0" stop-color="#5ff28a"/>
      <stop offset="1" stop-color="#30d158"/>
    </linearGradient>
  </defs>

  <!-- Background tile (macOS icon grid: 824 px tile, 100 px margin). -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- Shield. -->
  <path d="M512 196
           C 600 248, 690 268, 770 270
           C 770 520, 700 700, 512 828
           C 324 700, 254 520, 254 270
           C 334 268, 424 248, 512 196 Z"
        fill="url(#steel)"/>
  <path d="M512 196
           C 600 248, 690 268, 770 270
           C 770 520, 700 700, 512 828 Z"
        fill="#0b1622" fill-opacity="0.10"/>

  <!-- Chip pins. -->
  <g fill="#1b2c3d">
    <rect x="410" y="330" width="28" height="56" rx="8"/>
    <rect x="498" y="330" width="28" height="56" rx="8"/>
    <rect x="586" y="330" width="28" height="56" rx="8"/>
    <rect x="410" y="618" width="28" height="56" rx="8"/>
    <rect x="498" y="618" width="28" height="56" rx="8"/>
    <rect x="586" y="618" width="28" height="56" rx="8"/>
    <rect x="334" y="410" width="56" height="28" rx="8"/>
    <rect x="334" y="498" width="56" height="28" rx="8"/>
    <rect x="334" y="586" width="56" height="28" rx="8"/>
    <rect x="634" y="410" width="56" height="28" rx="8"/>
    <rect x="634" y="498" width="56" height="28" rx="8"/>
    <rect x="634" y="586" width="56" height="28" rx="8"/>
  </g>

  <!-- Chip body. -->
  <rect x="372" y="372" width="280" height="280" rx="44" fill="url(#chip)"/>
  <rect x="372" y="372" width="280" height="280" rx="44" fill="none"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="4"/>

  <!-- Keyhole. -->
  <g fill="url(#glow)">
    <circle cx="512" cy="482" r="50"/>
    <path d="M484 510 L540 510 L558 598 Q560 610 548 610 L476 610 Q464 610 466 598 Z"/>
  </g>
</svg>
