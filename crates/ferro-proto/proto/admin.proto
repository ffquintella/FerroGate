// FerroGate administrator surface (feature F20, ADR-0005).
//
// Served only on the dedicated admin listener (CMIS_ADMIN_LISTEN, default
// 127.0.0.1:8444) over hybrid-PQC TLS 1.3. Every method is classified in the
// server's METHOD_ACCESS table; a method missing from that table is denied.
//
// Login, step-up and enrollment carry a password and a second factor: TOTP
// (every client) or a FIDO2 / WebAuthn credential (the tray admin client
// only, F20 §5). CMIS is the WebAuthn relying party with RP ID
// `ferrogate-admin.<trust_domain>`; user verification is required and the
// attestation conveyance is "none".
//
// Secrets (passwords, TOTP codes, session/device/enrollment tokens) and
// WebAuthn responses travel only inside the admin TLS channel and never
// appear in logs or audit events.

syntax = "proto3";

package ferrogate.admin.v1;

service Admin {
  // ---- Authentication (public, throttled) ----
  rpc BeginLogin (BeginLoginRequest) returns (BeginLoginResponse);
  rpc Login (LoginRequest) returns (LoginResponse);

  // ---- Session (any authenticated session) ----
  rpc BeginStepUp (BeginStepUpRequest) returns (BeginStepUpResponse);
  rpc StepUp (StepUpRequest) returns (StepUpResponse);
  rpc Logout (LogoutRequest) returns (LogoutResponse);
  rpc WhoAmI (WhoAmIRequest) returns (WhoAmIResponse);
  rpc ListMySessions (ListMySessionsRequest) returns (ListMySessionsResponse);
  rpc RevokeSession (RevokeSessionRequest) returns (RevokeSessionResponse);
  rpc ChangePassword (ChangePasswordRequest) returns (ChangePasswordResponse);
  rpc ListMyFactors (ListMyFactorsRequest) returns (ListMyFactorsResponse);
  rpc BeginAddFactor (BeginAddFactorRequest) returns (BeginAddFactorResponse);
  rpc CompleteAddFactor (CompleteAddFactorRequest) returns (CompleteAddFactorResponse);
  rpc RemoveFactor (RemoveFactorRequest) returns (RemoveFactorResponse);

  // ---- Enrollment (public, throttled; the enrollment token is the credential) ----
  rpc BeginEnrollment (BeginEnrollmentRequest) returns (BeginEnrollmentResponse);
  rpc CompleteEnrollment (CompleteEnrollmentRequest) returns (CompleteEnrollmentResponse);

  // ---- Account administration ----
  rpc ListAdminAccounts (ListAdminAccountsRequest) returns (ListAdminAccountsResponse);
  rpc ListAdminGroups (ListAdminGroupsRequest) returns (ListAdminGroupsResponse);
  rpc CreateAdminAccount (CreateAdminAccountRequest) returns (CreateAdminAccountResponse);
  rpc UpdateAdminAccount (UpdateAdminAccountRequest) returns (UpdateAdminAccountResponse);
  rpc SetAdminAccountState (SetAdminAccountStateRequest) returns (SetAdminAccountStateResponse);
  rpc ResetAdminCredentials (ResetAdminCredentialsRequest) returns (ResetAdminCredentialsResponse);

  // ---- Application approvals (F19 §5.4) ----
  // Reads: app_request.list/read, approval.list/read. Decisions and edits
  // need a recent step-up; AdminRegisterApplication needs a per-operation
  // MfaProof. Every mutation emits exactly one audit event (plus one
  // ApprovalRevoked per `also_revoke_approval_ids` entry).
  rpc ListAppRequests (ListAppRequestsRequest) returns (ListAppRequestsResponse);
  rpc GetAppRequest (GetAppRequestRequest) returns (GetAppRequestResponse);
  rpc ApproveAppRequest (ApproveAppRequestRequest) returns (ApproveAppRequestResponse);
  rpc DenyAppRequest (DenyAppRequestRequest) returns (DenyAppRequestResponse);
  rpc ListApprovals (ListApprovalsRequest) returns (ListApprovalsResponse);
  rpc GetApproval (GetApprovalRequest) returns (GetApprovalResponse);
  rpc UpdateApproval (UpdateApprovalRequest) returns (UpdateApprovalResponse);
  rpc RevokeApproval (RevokeApprovalRequest) returns (RevokeApprovalResponse);
  rpc SetLineageAutoUpdateFrozen (SetLineageAutoUpdateFrozenRequest) returns (SetLineageAutoUpdateFrozenResponse);
  rpc AdminRegisterApplication (AdminRegisterApplicationRequest) returns (AdminRegisterApplicationResponse);

  // ---- Allowlist migration (F19 §11) ----
  // GetAllowlistMode: any session. SetAllowlistMode needs
  // settings.allowlist_mode and ImportLegacyAllowlists allowlist.import
  // (platform operators), both with a recent step-up. A dry run or a switch
  // to the mode already in force writes and audits nothing beyond the
  // layer's AdminCallAuthorized.
  rpc GetAllowlistMode (GetAllowlistModeRequest) returns (GetAllowlistModeResponse);
  rpc SetAllowlistMode (SetAllowlistModeRequest) returns (SetAllowlistModeResponse);
  rpc ImportLegacyAllowlists (ImportLegacyAllowlistsRequest) returns (ImportLegacyAllowlistsResponse);
}

// Client kind: 1 tui, 2 tray, 3 cli.
message ClientInfo { uint32 kind = 1; string version = 2; }

// Per-operation second-factor proof (F20 §7 "M"). For a WebAuthn proof,
// `nonce` is a `stepup_nonce` from BeginStepUp (single use, 2 min) and the
// assertion signs the challenge BeginStepUp returned with it. A TOTP proof
// needs no nonce.
message MfaProof {
  oneof f {
    string totp_code = 1;
    WebAuthnAssertion webauthn_assertion = 2;
  }
  bytes nonce = 3;
}

// ---- WebAuthn (FIDO2 security keys and platform authenticators) ----

// BeginLogin, BeginStepUp: request for an assertion.
message WebAuthnChallenge {
  bytes  challenge = 1;                    // single use, bound to the login or step-up nonce
  string rp_id = 2;                        // ferrogate-admin.<trust_domain>
  repeated bytes allow_credential_ids = 3; // decoys for unknown accounts
  uint32 user_verification = 4;            // 1 = required
  int64  timeout_ms = 5;
}
// Authenticator response to WebAuthnChallenge.
message WebAuthnAssertion {
  bytes credential_id = 1;
  bytes authenticator_data = 2;
  bytes client_data_json = 3;
  bytes signature = 4;
  bytes user_handle = 5;
}
// BeginEnrollment, BeginAddFactor: request for a new credential.
message WebAuthnCreationOptions {
  bytes  challenge = 1;
  string rp_id = 2;
  string rp_name = 3;
  bytes  user_id = 4;                      // opaque handle, not the admin id
  string user_name = 5;
  string display_name = 6;
  repeated int32 pub_key_cred_params = 7;  // COSE alg ids: -7 ES256, -8 EdDSA
  repeated bytes exclude_credential_ids = 8; // already enrolled keys
  uint32 user_verification = 9;            // 1 = required
  uint32 attestation = 10;                 // 1 = none
}
// Authenticator response to WebAuthnCreationOptions. Attestation formats
// `none` and `packed` are accepted; `label` is at most 64 characters.
message WebAuthnAttestation {
  bytes credential_id = 1;
  bytes attestation_object = 2;
  bytes client_data_json = 3;
  repeated string transports = 4;
  string label = 5;
}

// ---- Login ----

// `methods`: 1 totp, 2 webauthn — what this account may use from this client
// kind (the TUI and CLI get TOTP only). `webauthn` is set when 2 is listed.
message BeginLoginRequest  { string username = 1; string device_token = 2; ClientInfo client = 3; }
message BeginLoginResponse { bytes login_nonce = 1; repeated uint32 methods = 2; WebAuthnChallenge webauthn = 3; }

// `client` is the same `ClientInfo` sent to BeginLogin; `device_token`
// selects the throttle bucket (F20 §8) and is not a credential. A WebAuthn
// assertion signs the challenge BeginLogin returned with `login_nonce`.
message LoginRequest {
  bytes login_nonce = 1;
  string username = 2;
  string password = 3;
  oneof second_factor {
    string totp_code = 4;
    WebAuthnAssertion webauthn_assertion = 5;
  }
  string device_token = 6;
  ClientInfo client = 7;
}
message LoginResponse {
  string session_token = 1;
  int64 idle_timeout_secs = 2;
  int64 absolute_expires_at = 3;
  uint32 aal = 4;
  bool password_change_required = 5;
  int64 password_expires_at = 6;
  string device_token = 7;
  string admin_id = 8;
  string display_name = 9;
  repeated string groups = 10;
  // A tray session of a CMIS_ADMIN_TRAY_FIDO2_GROUPS member who holds no
  // FIDO2 credential yet: restricted to factor enrollment, WhoAmI and Logout.
  bool factor_enrollment_required = 11;
}

// ---- Step-up (rotates the session token) ----

// `webauthn` is set when this session may step up with a FIDO2 credential.
message BeginStepUpRequest  {}
message BeginStepUpResponse { bytes stepup_nonce = 1; WebAuthnChallenge webauthn = 2; }
message StepUpRequest  { bytes stepup_nonce = 1; MfaProof proof = 2; }
message StepUpResponse { string session_token = 1; int64 step_up_valid_until = 2; }

// ---- Session management ----

message LogoutRequest  {}
message LogoutResponse {}

message WhoAmIRequest {}
message WhoAmIResponse {
  string admin_id = 1;
  string username = 2;
  string display_name = 3;
  repeated string groups = 4;
  repeated string permissions = 5;
  uint32 aal = 6;
  int64 mfa_at = 7;
  bool restricted = 8;
  int64 password_expires_at = 9;
  string session_ref = 10;
  bool factor_enrollment_required = 11;
}

message SessionInfo {
  string session_ref = 1;
  int64 created_at = 2;
  int64 last_seen_at = 3;
  string source_ip = 4;
  uint32 client_kind = 5;
  bool current = 6;
  uint32 aal = 7;
}
message ListMySessionsRequest  {}
message ListMySessionsResponse { repeated SessionInfo sessions = 1; }

// Empty `admin_id` revokes one of the caller's own sessions; another account's
// session needs `session.revoke_any` and a fresh step-up.
message RevokeSessionRequest  { string session_ref = 1; string admin_id = 2; }
message RevokeSessionResponse {}

message ChangePasswordRequest  { string current_password = 1; string new_password = 2; MfaProof proof = 3; }
message ChangePasswordResponse { string session_token = 1; int64 password_expires_at = 2; }

// `method`: 1 totp, 2 webauthn.
message FactorInfo { string factor_id = 1; uint32 method = 2; string label = 3; int64 created_at = 4; int64 last_used_at = 5; }
message ListMyFactorsRequest  {}
message ListMyFactorsResponse { repeated FactorInfo factors = 1; }

// Factor management from a signed-in session (F20 §5, tray admin client).
// BeginAddFactor needs a recent step-up; CompleteAddFactor and RemoveFactor
// carry a per-operation proof of a factor the account already holds.
message BeginAddFactorRequest  { uint32 method = 1; }                    // 1 totp, 2 webauthn
message BeginAddFactorResponse {
  bytes enroll_nonce = 1;
  string totp_provisioning_uri = 2;
  WebAuthnCreationOptions webauthn_creation_options = 3;
}
message CompleteAddFactorRequest {
  string idempotency_key = 1;
  bytes enroll_nonce = 2;
  string label = 3;
  string totp_code = 4;
  WebAuthnAttestation webauthn_attestation = 5;
  MfaProof proof = 6;                                                      // proof of an existing factor
}
message CompleteAddFactorResponse { string factor_id = 1; }
message RemoveFactorRequest { string idempotency_key = 1; string factor_id = 2; MfaProof proof = 3; }
message RemoveFactorResponse {}

// ---- Enrollment ----

// `webauthn_creation_options` is set when the token enrolls second factors
// for an existing account (not for the TOTP-only bootstrap).
message BeginEnrollmentRequest  { string enrollment_token = 1; }
message BeginEnrollmentResponse {
  string username = 1;
  bool username_choosable = 2;
  string display_name = 3;
  string totp_provisioning_uri = 4;
  WebAuthnCreationOptions webauthn_creation_options = 5;
  uint32 password_min_len = 6;
}
// At least one of `totp_code` / `webauthn_attestation` when the token
// enrolls second factors; both may be sent.
message CompleteEnrollmentRequest {
  string enrollment_token = 1;
  string username = 2;
  string display_name = 3;
  string password = 4;
  string totp_code = 5;
  WebAuthnAttestation webauthn_attestation = 6;
}
message CompleteEnrollmentResponse { string admin_id = 1; }

// ---- Account administration ----

// `state`: 1 pending_enrollment, 2 active, 3 disabled.
message AdminAccountInfo {
  string admin_id = 1;
  string username = 2;
  string display_name = 3;
  uint32 state = 4;
  repeated string groups = 5;
  int64 created_at = 6;
  int64 last_login_at = 7;
  int64 password_expires_at = 8;
  uint64 row_version = 9;
}
message ListAdminAccountsRequest  {}
message ListAdminAccountsResponse { repeated AdminAccountInfo accounts = 1; }

message AdminGroupInfo { string group_id = 1; string name = 2; bool builtin = 3; repeated string permissions = 4; }
message ListAdminGroupsRequest  {}
message ListAdminGroupsResponse { repeated AdminGroupInfo groups = 1; }

message CreateAdminAccountRequest {
  string idempotency_key = 1;
  string username = 2;
  string display_name = 3;
  repeated string groups = 4;
  MfaProof proof = 5;
  int64 enrollment_ttl_secs = 6;
}
message CreateAdminAccountResponse { string admin_id = 1; string enrollment_token = 2; int64 enrollment_expires_at = 3; }

message UpdateAdminAccountRequest {
  string idempotency_key = 1;
  string admin_id = 2;
  uint64 expected_row_version = 3;
  optional string display_name = 4;
  bool replace_groups = 5;
  repeated string groups = 6;
  MfaProof proof = 7;
}
message UpdateAdminAccountResponse { uint64 row_version = 1; }

message SetAdminAccountStateRequest { string idempotency_key = 1; string admin_id = 2; uint32 state = 3; MfaProof proof = 4; }
message SetAdminAccountStateResponse { uint64 row_version = 1; }

message ResetAdminCredentialsRequest {
  string idempotency_key = 1;
  string admin_id = 2;
  bool reset_password = 3;
  bool reset_mfa = 4;
  MfaProof proof = 5;
}
message ResetAdminCredentialsResponse { string enrollment_token = 1; int64 expires_at = 2; }

// ---- Application approvals (F19 §5.4, §7.5) ----
//
// Integer codes follow the ledger (F19 §2):
//   request state   1 pending, 2 approved, 3 auto_approved, 4 denied, 5 expired
//   request kind    1 register, 2 update
//   request origin  1 self, 2 assisted, 3 admin_direct, 4 observed
//   approval state  1 active, 2 expired, 3 revoked
//   approval origin 1 manual, 2 auto_update, 3 admin_direct, 4 legacy_import
//   user kind       1 unix, 2 windows
//   user_scope      1 exact_user, 2 any_user
//   path_match      1 exact, 2 any
//   update_policy   1 manual_each_time, 2 auto_same_path_user
//   continuity      1 anchored, 2 path_user_only
//   platform        1 linux, 2 macos, 3 windows
//   format          1 elf, 2 macho, 3 pe, 9 other
// User names, SIDs and paths are personal data (F19 §10): shown to viewers
// and approvers, never written to the audit log.

// An operating-system user. `uid` is the Unix uid (or the Windows RID).
message AppUser {
  uint32 kind = 1;
  optional int64 uid = 2;
  string sid = 3;
  string name = 4;
}

// One binary of a lineage, as the host reported it at first sight.
message AppBinaryInfo {
  string bin_sha = 1;               // lowercase hex SHA-384
  uint32 revision = 2;
  uint64 file_size = 3;
  uint32 format = 4;
  string declared_version = 5;      // untrusted, display only
  uint32 version_source = 6;
  string product_name = 7;
  string bundle_id = 8;
  string package_name = 9;
  uint32 signer_kind = 10;          // 0 none, 1 authenticode, 2 apple
  string signer_id = 11;
  string signer_subject = 12;
  bool   signer_valid = 13;
  int64  first_seen_at = 14;
  string display_version = 15;      // "<declared> (r<N>)" or "r<N>"
}

message AppRequestInfo {
  string request_id = 1;
  string host_uuid = 2;
  string lineage_id = 3;
  string canonical_path = 4;
  string bin_sha = 5;
  uint32 revision = 6;
  uint32 kind = 7;
  uint32 origin = 8;
  AppUser target_user = 9;
  optional int64 requester_uid = 10;
  string requester_user_name = 11;
  string requested_by_admin_id = 12;
  string reason = 13;
  uint32 flags = 14;                // F19 §4.5 risk bits
  string host_tier = 15;
  int64  submitted_at = 16;
  int64  pending_expires_at = 17;
  uint32 state = 18;
  int64  decided_at = 19;
  string decided_by_admin_id = 20;
  uint32 decision_reason_code = 21;
  string decision_message = 22;
  string auto_downgrade_reason = 23;
  string resulting_approval_id = 24;
  bool   same_actor_approved = 25;
  string declared_version = 26;
  string product_name = 27;
  string display_version = 28;
}

message ApprovalInfo {
  string approval_id = 1;
  string host_uuid = 2;
  string lineage_id = 3;
  string canonical_path = 4;
  string bin_sha = 5;               // "*" only for legacy imports
  uint32 revision = 6;              // 0: none (legacy import)
  string source_request_id = 7;
  uint32 origin = 8;
  string parent_approval_id = 9;
  string approved_by_admin_id = 10;
  uint32 user_scope = 11;
  AppUser user = 12;
  uint32 path_match = 13;
  uint32 update_policy = 14;
  uint32 continuity = 15;
  int64  created_at = 16;
  int64  expires_at = 17;           // 0: no expiry
  uint32 state = 18;
  string superseded_by = 19;
  int64  revoked_at = 20;
  string revoked_by_admin_id = 21;
  uint32 revoke_reason_code = 22;
  string note = 23;
  uint64 row_version = 24;
  string declared_version = 25;
  string product_name = 26;
}

// The policy view of an approval at one revision (no personal data).
message ApprovalTermsSnapshot {
  uint32 state = 1;
  uint32 update_policy = 2;
  uint32 continuity = 3;
  int64  expires_at = 4;            // 0: no expiry
  uint32 user_scope = 5;
  uint32 path_match = 6;
  uint32 revoke_reason_code = 7;
}
// `change_kind`: 1 created, 2 updated, 3 expired, 4 revoked, 5 renewed.
message ApprovalRevisionInfo {
  uint64 row_version = 1;
  int64  changed_at = 2;
  string changed_by_admin_id = 3;   // empty: the sweeper or a policy
  uint32 change_kind = 4;
  ApprovalTermsSnapshot before = 5;
  ApprovalTermsSnapshot after = 6;
}

// Terms an approver chooses (F19 §5.4). `expires_at` 0 is the default TTL
// (CMIS_APPROVAL_DEFAULT_TTL_SECS); `no_expiry` needs
// CMIS_APPROVAL_ALLOW_NO_EXPIRY. `any_user` needs `confirm_any_user`.
message ApprovalTerms {
  uint32 user_scope = 1;            // 0 = exact_user
  uint32 path_match = 2;            // 0 = exact
  uint32 update_policy = 3;         // 0 = manual_each_time
  uint32 continuity = 4;            // 0 = anchored
  int64  expires_at = 5;
  bool   no_expiry = 6;
  string note = 7;                  // <= 500, no control characters
  bool   confirm_any_user = 8;
}

// Opaque, integrity-protected page cursor.
message PageRequest { uint32 page_size = 1; string page_token = 2; }

message ListAppRequestsRequest {
  repeated uint32 states = 1;
  string host_uuid = 2;
  string path_contains = 3;
  string product_contains = 4;
  string user_name = 5;
  string declared_version = 6;
  string bin_sha_prefix = 7;        // >= 8 hex characters
  repeated uint32 origins = 8;
  repeated uint32 kinds = 9;
  uint32 flags_any = 10;
  int64  submitted_after = 11;
  int64  submitted_before = 12;
  string text = 13;                 // <= 128
  bool   ascending = 14;            // default: newest first
  PageRequest page = 15;
}
message ListAppRequestsResponse { repeated AppRequestInfo items = 1; string next_page_token = 2; }

message GetAppRequestRequest { string request_id = 1; }
message GetAppRequestResponse {
  AppRequestInfo request = 1;
  AppBinaryInfo binary = 2;
  repeated AppBinaryInfo lineage_binaries = 3;
  repeated AppRequestInfo lineage_requests = 4;
  repeated ApprovalInfo lineage_approvals = 5;
  bool lineage_auto_update_frozen = 6;
}

message ApproveAppRequestRequest {
  string idempotency_key = 1;
  string request_id = 2;
  // A new approval with these terms, or an existing covering approval.
  oneof choice {
    ApprovalTerms terms = 3;
    string reuse_approval_id = 4;
  }
  // Approvals of the same host to revoke in the same transaction (INV-2:
  // each named explicitly and audited as its own revocation).
  repeated string also_revoke_approval_ids = 5;
  uint32 also_revoke_reason_code = 6;
  // Required when approving a request you registered yourself
  // (`admin_direct`, strict SoD off): a fresh second factor.
  MfaProof proof = 7;
}
message ApproveAppRequestResponse {
  AppRequestInfo request = 1;
  ApprovalInfo approval = 2;
  bool same_actor = 3;
  repeated string revoked_approval_ids = 4;
  uint64 allowlist_generation = 5;
}

message DenyAppRequestRequest {
  string idempotency_key = 1;
  string request_id = 2;
  uint32 reason_code = 3;           // required, non-zero
  string message = 4;               // <= 200, shown to the requester
}
message DenyAppRequestResponse { AppRequestInfo request = 1; }

message ListApprovalsRequest {
  repeated uint32 states = 1;
  string host_uuid = 2;
  string lineage_id = 3;
  string path_contains = 4;
  string product_contains = 5;
  string user_name = 6;
  string declared_version = 7;
  string bin_sha_prefix = 8;
  repeated uint32 policies = 9;
  repeated uint32 approval_origins = 10;
  int64  expires_before = 11;
  int64  expires_after = 12;
  int64  created_after = 13;
  int64  created_before = 14;
  bool   include_superseded = 15;
  bool   legacy_only = 16;
  bool   no_expiry_only = 17;
  string text = 18;
  bool   ascending = 19;
  PageRequest page = 20;
}
message ListApprovalsResponse { repeated ApprovalInfo items = 1; string next_page_token = 2; }

message GetApprovalRequest { string approval_id = 1; }
message GetApprovalResponse {
  ApprovalInfo approval = 1;
  repeated ApprovalRevisionInfo revisions = 2;
  repeated ApprovalInfo lineage_approvals = 3;
  AppBinaryInfo binary = 4;
}

// Unset fields stay unchanged. Scope can only be narrowed. A future
// `expires_at` on an EXPIRED approval renews it.
message UpdateApprovalRequest {
  string idempotency_key = 1;
  string approval_id = 2;
  uint64 expected_row_version = 3;
  optional uint32 update_policy = 4;
  optional uint32 continuity = 5;
  optional int64 expires_at = 6;
  bool clear_expiry = 7;            // no expiry (CMIS_APPROVAL_ALLOW_NO_EXPIRY)
  optional string note = 8;
  bool clear_note = 9;
  bool narrow_to_exact_user = 10;
  bool narrow_to_exact_path = 11;
}
message UpdateApprovalResponse { ApprovalInfo approval = 1; uint64 allowlist_generation = 2; }

message RevokeApprovalRequest {
  string idempotency_key = 1;
  string approval_id = 2;
  uint32 reason_code = 3;           // required, non-zero
  uint64 expected_row_version = 4;  // 0: whatever is current
}
message RevokeApprovalResponse { ApprovalInfo approval = 1; uint64 allowlist_generation = 2; }

message SetLineageAutoUpdateFrozenRequest { string idempotency_key = 1; string lineage_id = 2; bool frozen = 3; }
message SetLineageAutoUpdateFrozenResponse {}

// The binary of a direct registration, as the admin client identified it
// (`ferro-appid`). `flags` keeps only the host-settable bits.
message AppBinaryDesc {
  string canonical_path = 1;
  uint32 platform = 2;
  string sha384 = 3;                // lowercase hex
  uint64 size = 4;
  uint32 format = 5;
  string declared_version = 6;
  uint32 version_source = 7;
  string product_name = 8;
  string bundle_id = 9;
  string package_name = 10;
  uint32 signer_kind = 11;
  string signer_id = 12;
  string signer_subject = 13;
  bool   signer_valid = 14;
  uint32 flags = 15;
}

// Single step by default: the request is recorded APPROVED with its approval
// in one transaction (`AppApprovedBySameActor`). With CMIS_ADMIN_STRICT_SOD
// the request waits as PENDING for a different approver.
// `idempotency_key` (required, UUID): a retry by the same administrator
// returns the stored outcome.
message AdminRegisterApplicationRequest {
  string idempotency_key = 1;
  MfaProof proof = 2;
  string host_uuid = 3;
  AppBinaryDesc binary = 4;
  AppUser target_user = 5;
  string reason = 6;
  ApprovalTerms terms = 7;
}
message AdminRegisterApplicationResponse {
  AppRequestInfo request = 1;       // absent when deduplicated onto an approval
  ApprovalInfo approval = 2;        // absent while PENDING (strict SoD)
  bool queued = 3;                  // strict SoD: waits for another approver
  bool deduplicated = 4;            // an active approval already covered it
  uint64 allowlist_generation = 5;
}

// ---- Allowlist migration (F19 §11) ----
//
// Mode codes: 1 legacy (hand-provisioned v1 allowlists), 2 approvals (the
// F19 ledger). In approvals mode SetAllowlist and DeleteAllowlist answer
// FAILED_PRECONDITION `mode_approvals` and the legacy bodies stay read-only
// for a rollback.

message GetAllowlistModeRequest {}
message GetAllowlistModeResponse {
  uint32 mode = 1;
  bool legacy_get_allowlist = 2;    // CMIS_LEGACY_GETALLOWLIST on this node
}

// Switching to approvals (2) is refused with FAILED_PRECONDITION
// `import_stale` while a legacy import is still open although its entry has
// left the legacy body (run ImportLegacyAllowlists, which revokes it; no
// override), and with `import_incomplete` while a legacy entry has no
// approval, unless `allow_unimported`. Switching back to legacy (1) is refused with
// FAILED_PRECONDITION `confirmation_required` unless `confirm_rollback`:
// call with `dry_run` first to show the counts below to the operator.
message SetAllowlistModeRequest {
  string idempotency_key = 1;       // <= 128, optional
  uint32 mode = 2;                  // required: 1 legacy, 2 approvals
  bool dry_run = 3;                 // report only; nothing is written
  bool confirm_rollback = 4;
  bool allow_unimported = 5;
}
message SetAllowlistModeResponse {
  uint32 previous_mode = 1;
  uint32 mode = 2;                  // the mode in force after the call
  bool changed = 3;                 // false for a dry run or the same mode
  // To legacy: live approvals other than legacy imports (in practice the
  // approvals created since the switch) that the preserved legacy bodies do
  // not carry; they stop admitting callers.
  uint64 approvals_not_reflected = 4;
  // To legacy: legacy imports revoked or expired since the import that the
  // legacy bodies admit again.
  uint64 imports_readmitted = 5;
  // To approvals: legacy entries without an approval, and their hosts
  // (skipped bodies count as hosts).
  uint64 entries_not_imported = 6;
  uint32 hosts_not_imported = 7;
  // To approvals: open legacy imports whose entry is no longer in the
  // legacy body (or whose body was deleted or does not decode).
  uint64 stale_imports = 8;
}

// One legacy entry of the import report: imported as an any-path,
// manual-each-time approval without expiry ("legacy, no expiry").
message LegacyImportEntry {
  optional uint32 uid = 1;          // absent: any user
  string bin_sha = 2;               // lowercase hex SHA-384 or "*"
  bool already_imported = 3;
  bool revoked = 4;                 // its import was revoked: never recreated
}
// An import makes the ledger follow the legacy bodies: it creates the
// missing approvals and revokes (reason code 1000) the open imports whose
// entry left the body, so a removed binary cannot come back in approvals mode.
message LegacyImportHost {
  string host_uuid = 1;
  uint32 entries_to_create = 2;     // dry run: would be created
  uint32 entries_already_imported = 3;
  uint32 approvals_created = 4;     // import: created by this call
  string skipped = 5;               // "undecodable", "not_a_host_uuid"; empty: imported
  repeated LegacyImportEntry entries = 6;
  uint64 allowlist_generation = 7;  // import: after the call (0: unchanged)
  uint32 stale_imports = 8;         // dry run: would be revoked; import: still open (body unreadable)
  uint32 imports_revoked = 9;       // import: stale imports revoked by this call
  uint32 entries_revoked = 10;      // entries of the body whose import was revoked earlier
}
message ImportLegacyAllowlistsRequest {
  string idempotency_key = 1;       // <= 128, optional
  bool dry_run = 2;
}
// Hosts and entries are listed up to a bound (`hosts_truncated`,
// `entries_truncated`); the totals are always complete. Re-running an import
// creates and revokes nothing new.
message ImportLegacyAllowlistsResponse {
  bool dry_run = 1;
  repeated LegacyImportHost hosts = 2;
  uint64 approvals_created = 3;
  uint64 entries_to_create = 4;
  uint64 entries_already_imported = 5;
  uint32 hosts_skipped = 6;
  bool entries_truncated = 7;
  uint64 stale_imports = 8;         // dry run: would be revoked; import: left open (unreadable bodies)
  uint64 imports_revoked = 9;
  bool hosts_truncated = 10;
}
