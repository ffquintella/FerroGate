# FerroGate Machine Identity Agent (MIA) — configuration file (TOML).
#
# This is an OPTIONAL structured alternative to the environment-file template
# (mia.env). MIA discovers it at `--config <path>`, then $FERROGATE_CONFIG, then
# the OS system path, then the per-user path:
#
#   Linux    /etc/ferrogate/mia.toml                       ~/.config/ferrogate/mia.toml
#   macOS    /Library/Application Support/FerroGate/...     ~/Library/Application Support/FerroGate/...
#   Windows  %ProgramData%\FerroGate\mia.toml               %APPDATA%\FerroGate\mia.toml
#
# Precedence is
#
#     built-in defaults  <  this file  <  environment variables
#
# so an explicitly-set FERROGATE_* / RUST_LOG variable always overrides the
# value here. Every key below is optional; omit a key to take its default.
# Generate or edit this file interactively with `mia setup`.

# Tracing verbosity (tracing EnvFilter syntax). Overridden by $RUST_LOG.
# Default: "info".
#log = "info"

# --- CMIS server ------------------------------------------------------------
# The Central Machine Identity Service this agent attests to. An https:// URL
# is dialed over hybrid-PQC TLS and pinned by SPKI; http:// is plaintext
# bring-up only.
[cmis]
#endpoint = "https://cmis.example.com:8443"
# High availability: instead of a single `endpoint`, point at a DNS SRV record
# advertising the CMIS nodes. The agent resolves it, prefers records by RFC 2782
# priority/weight, dials the best live node over hybrid-PQC TLS, and fails over
# to the next one automatically (re-resolving so a rescaled cluster is followed).
# Mutually exclusive with `endpoint`; the pin below authenticates every node.
#srv = "_cmis._tcp.example.com"
# Accepted CMIS SPKI pin (lowercase-hex SHA-384). Required with endpoint or srv.
#spki_pin = "<hex-sha384>"

# --- Helper API (feature F08) -----------------------------------------------
# The local helper API is ON by default. Set `enable = false` (or
# FERROGATE_HELPER_ENABLE=0) to switch it off; leaving `socket` unset no longer
# does — it just selects the platform default below. Callers are still refused
# unless they are on the signed allowlist ([allowlist], fail closed).
[helper]
#enable = true
# The local helper listener: a Unix socket path (Linux/macOS) or a named-pipe
# name (Windows). Unset => the platform default for this environment
# (mia-<env>.toml gets an `-<env>` suffix, so environments never collide):
#   Linux    /run/ferrogate/mia.sock          (mia-<env>.sock)
#   macOS    /Library/Application Support/FerroGate/run/mia.sock
#   Windows  \\.\pipe\ferrogate-mia           (\\.\pipe\ferrogate-mia-<env>)
# The unsuffixed (well-known) address belongs to the host's DEFAULT
# environment: this file, unless `default_environment` in environments.toml
# (same directory; or FERROGATE_DEFAULT_ENVIRONMENT) selects a mia-<env>.toml.
# That environment then takes the well-known address and this file yields to
# mia.default.sock (\\.\pipe\ferrogate-mia.default). An explicit `socket`
# naming the well-known address is refused in any non-default environment.
# Set it only to move the listener.
#socket = "/run/ferrogate/mia.sock"
# Unix only. Octal socket mode (as a string). Default: "660".
#socket_mode = "660"
# Unix only. Numeric gid that owns the socket; members of that group may open
# it (with the default 0660 mode). `make mia-install` creates a dedicated
# FerroGate group and sets this via FERROGATE_HELPER_SOCKET_GID, so you don't
# normally set it here. Unset on macOS => a socket in the default run/
# directory takes the group of /Library/Application Support/FerroGate
# (ferrogate-status after a package install). A group *name* is not accepted
# (the daemon is unsafe-free and won't call getgrnam); use the numeric gid.
#socket_gid = "555"
# Windows only. Local group whose members may open the pipe (blank => default
# pipe DACL).
#windows_group = "FerroGateClients"
# Windows only. Require a valid Authenticode signature on every caller's image
# (the Code-Integrity analogue of the Linux IMA check). Default: true. Set false
# for environments whose clients (and mia itself) are not code-signed — identity
# then rests on PID + image SHA-384 + RID only.
#require_authenticode = true

# --- Allowlist --------------------------------------------------------------
# Signed CBOR allowlist of vetted local callers. `path` unset => the platform
# default for this environment, beside this file (mia-<env>.toml gets an
# `-<env>` suffix, so environments never share one body):
#   Linux    /etc/ferrogate/allowlist.cbor          (allowlist-<env>.cbor)
#   macOS    /Library/Application Support/FerroGate/allowlist.cbor
#   Windows  %ProgramData%\FerroGate\allowlist.cbor
# Set it only to move the body. `key` — the CMIS enrollment public key that
# verifies the body — has NO default: without it every caller is denied (fail
# closed), and it is required whenever `path` is set. A missing, stale or
# non-verifying body also denies every caller.
[allowlist]
#path = "/etc/ferrogate/allowlist.cbor"
#key = "/etc/ferrogate/allowlist.pub"
# Maximum accepted allowlist age in seconds. Default: 259200 (72 h). CMIS
# auto-renews an aging allowlist on each fetch, so it stays inside this bound as
# long as the host can reach CMIS; keep it ≥ the CMIS allowlist_ttl_secs.
#max_age_secs = 259200
# Fetch this host's signed allowlist from CMIS at startup (the GetAllowlist RPC,
# keyed by the host's EK-derived UUID) and write it to `path` (or its default)
# before loading, so
# the on-disk artefact stays in sync with what the operator provisioned. Needs
# cmis.endpoint + cmis.spki_pin and a successful attestation; a fetch failure is
# non-fatal and falls back to whatever is already at `path`. Default: false.
#fetch = false
# Propose the local callers this host observes (granted and denied) to CMIS
# periodically. CMIS auto-adopts the first proposal on a host with no allowlist
# (bootstrap/TOFU) or queues it for operator review, per its policy. Needs
# cmis.endpoint + cmis.spki_pin and a host SVID. Default: false.
#propose = false
# How often (seconds) to propose when `propose` is set. Default: 300.
#propose_interval_secs = 300

# --- Attestation ------------------------------------------------------------
[attestation]
# Override the IMA runtime-measurement log path.
#ima_log = "/sys/kernel/security/integrity/ima/ascii_runtime_measurements"

# Attestation backend. Default "host-key" (TPM-less profile: hardware
# fingerprint + machine signing key), works on every platform.
#
# "virtual-tpm" runs the full TPM attestation handshake against an INSECURE
# in-process software TPM — dev/test only, and only when the daemon was built
# with the `virtual-tpm` cargo feature (a release build refuses it, fail
# closed). It only succeeds against a CMIS configured to trust the software
# EK root and PCR digest logged at startup. Never use in production.
#backend = "host-key"

# --- Status endpoint (feature F18) -------------------------------------------
# A read-only local endpoint, separate from the helper socket, that the
# mia-tray companion and `mia status` read: per-environment state (SVID
# validity, CMIS node, CRL age, allowlist state, attestation backend) and a
# redacted tail of the daemon's own log. It never carries tokens, SVIDs, keys,
# pins or caller identities, and accepts no write requests. Read from the
# primary configuration only (a [status] table in mia-<env>.toml is ignored).
[status]
# Serve the endpoint. Default: true. Env: FERROGATE_STATUS_ENABLE.
#enable = true
# Listener: a Unix socket (Linux/macOS) or a named pipe (Windows). Defaults:
#   Linux   /run/ferrogate/mia-status.sock
#   macOS   /var/run/ferrogate/mia-status.sock
#   Windows \\.\pipe\ferrogate-mia-status
# Env: FERROGATE_STATUS_SOCKET.
#socket = "/run/ferrogate/mia-status.sock"
# Who may read status. Unix: the socket is 0660 and owned by this group —
# give the numeric gid in `socket_gid`, or a group *name* in `group` that is
# listed in /etc/group (default "ferrogate-status"; directory-service-only
# groups, e.g. macOS dscl groups, need socket_gid). Windows: the local group
# granted on the pipe DACL besides SYSTEM and Administrators (default
# "FerroGateStatus"). Env: FERROGATE_STATUS_SOCKET_GID, FERROGATE_STATUS_GROUP.
#socket_gid = "991"
#group = "ferrogate-status"
# Requests per second allowed per caller uid. Default: 10.
# Env: FERROGATE_STATUS_RATE_LIMIT.
#rate_limit_per_sec = 10
# Log ring buffer served to the tray's log viewer: at most this many records
# and about this many bytes (whichever is hit first); 0 disables it. Records
# are redacted before they are buffered, and only levels the `log` directive
# above already enables are kept. Defaults: 2000 records, 1048576 bytes.
# Env: FERROGATE_STATUS_LOG_RECORDS, FERROGATE_STATUS_LOG_BYTES.
#log_buffer_records = 2000
#log_buffer_bytes = 1048576
