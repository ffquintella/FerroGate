[package]
name        = "cmis"
description = "FerroGate — Central Machine Identity Service (gRPC server)"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
publish                = false

[lib]
name = "cmis"
path = "src/lib.rs"

[[bin]]
name = "cmis"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
ferro-crypto = { path = "../ferro-crypto" }
ferro-attest = { path = "../ferro-attest" }
ferro-audit  = { path = "../ferro-audit" }
ferro-proto  = { path = "../ferro-proto" }
ferro-svid   = { path = "../ferro-svid" }
ferro-raft   = { path = "../ferro-raft" }
ferro-tee    = { path = "../ferro-tee" }
ferro-sep    = { path = "../ferro-sep" }

serde              = { workspace = true }

tokio              = { workspace = true }
tokio-stream       = { workspace = true }
tokio-rustls       = { workspace = true }
rustls-pki-types   = { workspace = true }
tonic              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
parking_lot        = { workspace = true }
rand_core          = { workspace = true }
getrandom          = { workspace = true }
sha2               = { workspace = true }
hex                = { workspace = true }
serde_json         = { workspace = true }
ciborium           = { workspace = true }
base64             = { workspace = true }
# administrator authentication (F20)
argon2                = { workspace = true }
hmac                  = { workspace = true }
sha1                  = { workspace = true }
subtle                = { workspace = true }
zeroize               = { workspace = true }
chacha20poly1305      = { workspace = true }
unicode-normalization = { workspace = true }
uuid                  = { workspace = true, features = ["v7"] }
tower                 = { workspace = true }
# FIDO2 / WebAuthn verification (F20 wave B): ES256 and EdDSA credential
# keys and `packed` x5c attestation certificates. All already in the
# workspace; `webauthn-rs` is not used because its core needs OpenSSL, which
# deny.toml bans.
p256                  = { workspace = true }
ed25519-dalek         = { workspace = true }
x509-parser           = { workspace = true }

[dev-dependencies]
futures           = { workspace = true }
ferro-svid-verify = { path = "../ferro-svid-verify" }
ferro-transport   = { path = "../ferro-transport" }
rcgen             = { workspace = true }
prost             = { workspace = true }
prost-types       = { workspace = true }
